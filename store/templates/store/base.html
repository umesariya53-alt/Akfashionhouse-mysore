<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AK FASHION HOUSE - Mysore</title>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;margin:0;padding:15px}
h1{color:#d4af37;letter-spacing:3px}
.loc{color:#aaa;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.card{background:#111;border:2px solid #d4af37;border-radius:18px;padding:22px 5px;color:#d4af37;font-weight:bold;text-decoration:none;display:block}
.card span{color:#fff;font-size:12px;display:block;margin-top:6px}
.btn{display:inline-block;margin-top:30px;background:#d4af37;color:#000;padding:13px 30px;border-radius:30px;text-decoration:none;font-weight:bold}
footer{margin-top:30px;color:#555;font-size:11px}
</style>
</head>
<body>
<h1>AK FASHION HOUSE</h1>
<p class="loc">📍 Mysore, Karnataka | Premium Mens Wear</p>
<div class="grid">
{% for c in cats %}
<a class="card" href="/category/{{ c.name }}/">{{ c.icon }} {{ c.name }}<span>From Rs.{{ c.price }}</span></a>
{% endfor %}
</div>
<a class="btn" href="https://wa.me/917795935958?text=Hi%20AK%20FASHION%20HOUSE%20Mysore">WhatsApp Order</a>
<footer>AK FASHION HOUSE © 2026 - MYSORE</footer>
</body>
</html>
