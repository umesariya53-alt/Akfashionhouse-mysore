<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ cat_name }} - AK Fashion</title>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:15px;margin:0}
a{color:#d4af37;text-decoration:none}
h2{color:#d4af37;text-align:center}
.card{background:#111;border:1px solid #d4af37;border-radius:15px;padding:15px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}
.price{color:#fff}
.btn2{background:#d4af37;color:#000;padding:8px 15px;border-radius:20px;font-size:12px;font-weight:bold}
</style>
</head>
<body>
<a href="/">← Back</a>
<h2>{{ cat_name }}</h2>
{% for p in products %}
<div class="card">
<div><b>{{ p.name }}</b><br><span class="price">Rs.{{ p.price }}</span></div>
<a class="btn2" href="https://wa.me/917795935958?text=I%20want%20{{ p.name }}">Order</a>
</div>
{% empty %}
<p style="text-align:center;color:#777;margin-top:50px">No products yet in {{ cat_name }}. Add from Admin panel.</p>
{% endfor %}
</body>
</html>
